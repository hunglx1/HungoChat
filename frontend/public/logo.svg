<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hungoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="hungoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="48" height="48" rx="14" fill="url(#hungoGradient)" filter="url(#glow)"/>
  
  <!-- Modern Geometric "H" Lettermark -->
  <!-- Left Pillar -->
  <rect x="11" y="11" width="7" height="26" rx="3.5" fill="white" />
  
  <!-- Right Pillar -->
  <rect x="30" y="11" width="7" height="26" rx="3.5" fill="white" />
  
  <!-- Center Bridge (Chat bar) with subtle angle and rounded edges -->
  <rect x="15" y="21" width="18" height="6" rx="3" fill="url(#hungoAccent)" />
  <rect x="16" y="22" width="16" height="4" rx="2" fill="white" />
  
  <!-- Notification Sparkle Dot -->
  <circle cx="34" cy="11" r="2.5" fill="#38BDF8" />
</svg>
